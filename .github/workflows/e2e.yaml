name: E2E Tests

# The live evidence checks (crates/allama-examples/tests/live_evidence) are
# not run here: they record provider behaviour for design decisions, and the
# rate-limit checks send bursts on purpose. Run them by hand; the module docs
# of tests/live_evidence/main.rs say how.

on:
  schedule:
    # Weekly, Monday 06:00 UTC, to catch provider drift.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to test"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - anthropic
          - gemini
          - openai
          - openai-compat/all
          - openai-compat/azure
          - openai-compat/cloudflare
          - openai-compat/generic
          - openai-compat/presets

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # Every step runs in the devenv shell, with the project's toolchain.
    shell: devenv shell -- bash -e {0}

jobs:
  credentials:
    name: Credentials
    runs-on: ubuntu-latest
    outputs:
      anthropic: ${{ steps.check.outputs.anthropic }}
      gemini: ${{ steps.check.outputs.gemini }}
      openai: ${{ steps.check.outputs.openai }}
      cloudflare: ${{ steps.check.outputs.cloudflare }}
      azure: ${{ steps.check.outputs.azure }}
      newest: ${{ steps.check.outputs.newest }}

    steps:
      # Provider jobs skip when their credentials are missing on manual runs,
      # and fail on the scheduled run (which must have every secret); Azure
      # is optional and skips on every run.
      #
      # The expressions are evaluated by GitHub, so only `true` or `false`
      # reaches the runner, never a secret: a mistake in this step cannot
      # write one to the job outputs.
      - name: Check which provider secrets are configured
        id: check
        shell: bash
        env:
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
          OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          AZURE: ${{ secrets.AZURE_OPENAI_API_KEY != '' && secrets.AZURE_OPENAI_RESOURCE != '' }}
          EVENT: ${{ github.event_name }}
          SELECTED: ${{ inputs.provider }}
        run: |
          # The vendors whose newest model the `newest` matrix checks: those
          # selected and configured, and every one on the scheduled run.
          newest=()
          for vendor in anthropic gemini openai; do
            configured=${vendor^^}
            if [[ $EVENT == schedule ]] ||
              [[ ($SELECTED == all || $SELECTED == "$vendor") && ${!configured} == true ]]; then
              newest+=("$vendor")
            fi
          done
          {
            echo "anthropic=$ANTHROPIC"
            echo "gemini=$GEMINI"
            echo "openai=$OPENAI"
            echo "cloudflare=$CLOUDFLARE"
            echo "azure=$AZURE"
            echo "newest=$(jq -cn '$ARGS.positional' --args ${newest[@]+"${newest[@]}"})"
          } >> "$GITHUB_OUTPUT"

  anthropic:
    name: Anthropic
    needs: credentials
    if: |
      (github.event_name == 'schedule' || inputs.provider == 'all' || inputs.provider == 'anthropic') &&
      (needs.credentials.outputs.anthropic == 'true' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@90406f4a932213700a1ecf235ea13ba70fe9ac5d # v0.2.1
        with:
          # Leaves out the services the shell runs locally.
          profile: ci

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}

      - name: Run e2e tests
        run: cargo test --locked -p allama-anthropic --test e2e -- --ignored --nocapture
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  gemini:
    name: Gemini
    needs: credentials
    if: |
      (github.event_name == 'schedule' || inputs.provider == 'all' || inputs.provider == 'gemini') &&
      (needs.credentials.outputs.gemini == 'true' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@90406f4a932213700a1ecf235ea13ba70fe9ac5d # v0.2.1
        with:
          # Leaves out the services the shell runs locally.
          profile: ci

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}

      - name: Run e2e tests
        run: cargo test --locked -p allama-gemini --test e2e -- --ignored --nocapture
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  openai:
    name: OpenAI
    needs: credentials
    if: |
      (github.event_name == 'schedule' || inputs.provider == 'all' || inputs.provider == 'openai') &&
      (needs.credentials.outputs.openai == 'true' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@90406f4a932213700a1ecf235ea13ba70fe9ac5d # v0.2.1
        with:
          # Leaves out the services the shell runs locally.
          profile: ci

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}

      - name: Run e2e tests
        run: cargo test --locked -p allama-openai --test e2e --test e2e_responses -- --ignored --nocapture
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # The sampling drift check (ADR 0015 decision 4): `temperature(0.2)` on
  # each vendor's newest model, resolved from its models API by
  # scripts/newest-model.sh, must be answered or refused as
  # `Unsupported { stage: Provider, subject: Field }`, never
  # `InvalidRequest`. A failure means a new refusal wording the adapter's
  # error mapping does not recognize. One short call per endpoint.
  newest:
    name: Newest model (${{ matrix.provider }})
    needs: credentials
    if: needs.credentials.outputs.newest != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.credentials.outputs.newest) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@90406f4a932213700a1ecf235ea13ba70fe9ac5d # v0.2.1
        with:
          # Leaves out the services the shell runs locally.
          profile: ci

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}

      - name: Sampling on the newest model
        run: |
          model=$(scripts/newest-model.sh "$PROVIDER")
          echo "Newest model: $model"
          export "${PROVIDER^^}_NEWEST_MODEL=$model"
          cargo test --locked -p allama-examples --test newest_models "$PROVIDER" -- --ignored --nocapture
        env:
          PROVIDER: ${{ matrix.provider }}
          # Each matrix entry gets its own vendor's key only.
          ANTHROPIC_API_KEY: ${{ matrix.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          GEMINI_API_KEY: ${{ matrix.provider == 'gemini' && secrets.GEMINI_API_KEY || '' }}
          OPENAI_API_KEY: ${{ matrix.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}

  cross-provider:
    name: Cross-provider history
    needs: credentials
    if: |
      (github.event_name == 'schedule' || inputs.provider == 'all') &&
      ((needs.credentials.outputs.anthropic == 'true' && needs.credentials.outputs.gemini == 'true') || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@90406f4a932213700a1ecf235ea13ba70fe9ac5d # v0.2.1
        with:
          # Leaves out the services the shell runs locally.
          profile: ci

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}

      - name: Claude thinking history continues on Gemini 3
        run: cargo test --locked -p allama-examples --test cross_provider -- --ignored --nocapture
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  openai-compat-cloudflare:
    name: OpenAI Compatible (Cloudflare)
    needs: credentials
    if: |
      (github.event_name == 'schedule' || inputs.provider == 'all' || inputs.provider == 'openai-compat/all' || inputs.provider == 'openai-compat/cloudflare') &&
      (needs.credentials.outputs.cloudflare == 'true' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@90406f4a932213700a1ecf235ea13ba70fe9ac5d # v0.2.1
        with:
          # Leaves out the services the shell runs locally.
          profile: ci

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}

      - name: Run e2e tests
        run: cargo test --locked -p allama-openai-compat --test e2e_cloudflare -- --ignored --nocapture
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Clef decision models, on the same account (allama-systemone's
      # Cloudflare preset).
      - name: Run decision e2e tests
        run: cargo test --locked -p allama-systemone --test e2e_cloudflare -- --ignored --nocapture
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Azure OpenAI, on both of its chat APIs. Optional: skipped whenever its
  # secrets are missing, the scheduled run included. Model names are
  # deployment names on the configured resource.
  openai-compat-azure:
    name: OpenAI Compatible (Azure)
    needs: credentials
    if: |
      (github.event_name == 'schedule' || inputs.provider == 'all' || inputs.provider == 'openai-compat/all' || inputs.provider == 'openai-compat/azure') &&
      needs.credentials.outputs.azure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@90406f4a932213700a1ecf235ea13ba70fe9ac5d # v0.2.1
        with:
          # Leaves out the services the shell runs locally.
          profile: ci

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}

      - name: Run e2e tests
        run: cargo test --locked -p allama-openai-compat --test e2e_azure -- --ignored --nocapture
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_RESOURCE: ${{ secrets.AZURE_OPENAI_RESOURCE }}
          AZURE_E2E_MODEL: gpt-5.6-luna

      # Chat Completions refuses gpt-6-luna's function tools at its default
      # reasoning effort, so only the Responses tests run on it.
      - name: Run Responses e2e tests on GPT-6
        run: cargo test --locked -p allama-openai-compat --test e2e_azure responses -- --ignored --nocapture
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_RESOURCE: ${{ secrets.AZURE_OPENAI_RESOURCE }}
          AZURE_E2E_MODEL: gpt-6-luna

  # The generic provider (a base URL and a key, no preset dialect) against
  # OpenAI's own API, the reference every compatible endpoint follows. It
  # pointed at GitHub Models until GitHub retired that service on
  # 2026-07-30.
  openai-compat-generic:
    name: OpenAI Compatible (generic)
    needs: credentials
    if: |
      (github.event_name == 'schedule' || inputs.provider == 'all' || inputs.provider == 'openai-compat/all' || inputs.provider == 'openai-compat/generic') &&
      (needs.credentials.outputs.openai == 'true' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@90406f4a932213700a1ecf235ea13ba70fe9ac5d # v0.2.1
        with:
          # Leaves out the services the shell runs locally.
          profile: ci

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}

      - name: Run e2e tests
        run: cargo test --locked -p allama-openai-compat --test e2e -- --ignored --nocapture
        env:
          OPENAI_COMPAT_BASE_URL: https://api.openai.com/v1
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # gpt-4.1-nano shuts down on 2026-10-23; OpenAI names this its
          # replacement.
          OPENAI_COMPAT_MODEL: gpt-5.6-luna
          OPENAI_COMPAT_EMBEDDING_MODEL: text-embedding-3-small

  # The hosted presets (Groq, OpenRouter, DeepSeek, Mistral, Together,
  # Fireworks, DeepInfra, xAI, GitHub Copilot). Optional: each preset's test
  # skips when its secret is missing, so this job covers whichever keys are
  # configured. Copilot needs a token with a Copilot seat (a fine-grained
  # token with "Copilot Requests"): this repository is user-owned, so the
  # workflow's own token cannot be granted `copilot-requests`.
  openai-compat-presets:
    name: OpenAI Compatible (presets)
    if: |
      github.event_name == 'schedule' ||
      inputs.provider == 'all' ||
      inputs.provider == 'openai-compat/all' ||
      inputs.provider == 'openai-compat/presets'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@90406f4a932213700a1ecf235ea13ba70fe9ac5d # v0.2.1
        with:
          # Leaves out the services the shell runs locally.
          profile: ci

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}

      - name: Run e2e tests
        run: cargo test --locked -p allama-openai-compat --test e2e_presets -- --ignored --nocapture
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
