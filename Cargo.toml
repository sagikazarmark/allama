[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/allama"

[workspace.dependencies]
# Without default features, so no library turns on `warning-events` for the
# application; members that want the events opt in.
allama = { version = "0.2.0", path = "crates/allama", default-features = false }
allama-anthropic = { version = "0.2.0", path = "crates/allama-anthropic", default-features = false }
allama-cloudflare-worker = { version = "0.2.0", path = "crates/allama-cloudflare-worker" }
allama-conformance = { version = "0.2.0", path = "crates/allama-conformance", default-features = false }
# Exact pin: allama-derive emits code against allama internals, so the two
# must release in lockstep (like serde and serde_derive).
allama-derive = { version = "=0.2.0", path = "crates/allama-derive" }
allama-gemini = { version = "0.2.0", path = "crates/allama-gemini", default-features = false }
allama-http = { version = "0.2.0", path = "crates/allama-http", default-features = false }
allama-openai = { version = "0.2.0", path = "crates/allama-openai", default-features = false }
# Exact pin: allama-openai and allama-cloudflare-worker build on
# allama-openai-compat's `#[doc(hidden)]` items (`*WireOptions`, the hook
# methods, `binding`), which carry no semver promise, so the crates must
# release in lockstep (like allama and allama-derive above).
allama-openai-compat = { version = "=0.2.0", path = "crates/allama-openai-compat", default-features = false }
allama-providers = { version = "0.2.0", path = "crates/allama-providers", default-features = false }
# Exact pin: allama-cloudflare-worker builds on allama-systemone's
# `#[doc(hidden)]` codec (`binding`), which carries no semver promise.
allama-systemone = { version = "=0.2.0", path = "crates/allama-systemone", default-features = false }

anyhow = "1"
axum = "0.8"
bytes = "1"
criterion = "0.8"
futures-core = "0.3"
futures-executor = "0.3"
futures-timer = "3"
futures-util = "0.3"
heck = "0.5"
js-sys = "0.3"
opentelemetry = { version = "0.33.1", default-features = false }
opentelemetry_sdk = { version = "0.33.1", default-features = false }
proc-macro2 = "1"
quote = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
reqwest-middleware = "0.5"
reqwest-tracing = "0.7"
rustls = { version = "0.23", default-features = false }
schemars = "1.2"
send_wrapper = "0.6"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0.118"
serde_path_to_error = "0.1"
syn = "3"
tempfile = "3"
tokio = "1"
tracing = { version = "0.1", default-features = false }
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = "0.3"
trybuild = "1"
uuid = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
web-time = "1"
worker = "0.8"

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.metadata.release]
sign-commit = true
sign-tag = true
shared-version = true
tag-message = "Release {{version}}"
tag-name = "v{{version}}"
