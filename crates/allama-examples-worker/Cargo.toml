[package]
name = "allama-examples-worker"
version = { workspace = true }
description = "A Cloudflare Worker calling an HTTP provider over the Workers fetch API"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
publish = false

# `worker-build` builds the Worker's wasm; `wrangler dev` serves it.
[lib]
crate-type = ["cdylib"]

[dependencies]
allama = { workspace = true }
allama-http = { workspace = true, features = ["tower"] }
# Without `reqwest`: the provider sends over the transport the Worker gives it.
allama-openai-compat = { workspace = true }

futures-util = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-worker-fetch = { workspace = true }
worker = { workspace = true, features = ["http"] }

[package.metadata.release]
release = false

[lints]
workspace = true
